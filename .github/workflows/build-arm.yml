name: package-drw-arm

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  package-generic-linux-armv7:
    runs-on: ubuntu-22.04
    env:
      # Instructs cargo to build for ARMv7 by default (avoids needing to edit release.sh if it uses standard cargo build)
      CARGO_BUILD_TARGET: armv7-unknown-linux-gnueabihf
      # Tells the Rust compiler which C-linker to use for the ARMv7 cross-compilation
      CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
    steps:
    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
      with:
        persist-credentials: false
        ref: ${{ inputs.branch }}

    - name: Install prerequisites
      run: |
        chmod +x bin/**/*.sh bin/*.sh
        chmod -R +x bin/
        bin/install_prerequisites_ubuntu.sh

    # NEW: Install the C cross-compiler toolchain required for ARMv7
    - name: Install ARMv7 cross-compiler
      run: |
        # 1. Setup architectures and sources
        sudo dpkg --add-architecture armhf
        sudo sed -i -e 's/deb http/deb [arch=amd64,i386] http/g' /etc/apt/sources.list
        sudo sed -i -e 's/deb mirror/deb [arch=amd64,i386] mirror/g' /etc/apt/sources.list
        
        sudo tee /etc/apt/sources.list.d/armhf.list <<EOF
        deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports/ jammy main restricted universe multiverse
        deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports/ jammy-updates main restricted universe multiverse
        deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports/ jammy-security main restricted universe multiverse
        EOF
        
        sudo apt-get update
        
        # 2. NEW: Purge the pre-installed 64-bit headers that cause the dpkg conflict
        sudo apt-get remove -y libcurl4-openssl-dev libssl-dev libxml2-dev
        
        # 3. Install the ARMv7 toolchain and ARMv7 specific headers
        sudo apt-get install -y gcc-arm-linux-gnueabihf libc6-dev-armhf-cross \
          libssl-dev:armhf pkg-config libxml2-dev:armhf libcurl4-openssl-dev:armhf

    - name: Install Python 3.11
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 #v6.2.0
      with:
        python-version: '3.11'

    - name: Activate python3 venv
      run: |
        bin/activate_python3_venv.sh
        echo "/tmp/hurl-python3-venv/bin" >> "${GITHUB_PATH}"

    - name: Python infos
      run: |
        which python3
        python3 --version
        pip --version

    - name : Environment
      run: bin/environment.sh

    - name: Install rust
      run: |
        bin/install_rust.sh
        # NEW: Ensure the specific ARMv7 target is added to your toolchain
        rustup target add armv7-unknown-linux-gnueabihf

    - name: Build
      run: |
        # Export the OpenSSL and pkg-config variables directly into the current shell
        # so the release.sh script cannot miss them.
        export OPENSSL_DIR=/usr
        export OPENSSL_INCLUDE_DIR=/usr/include/arm-linux-gnueabihf
        export OPENSSL_LIB_DIR=/usr/lib/arm-linux-gnueabihf
        export PKG_CONFIG_ALLOW_CROSS=1
        export PKG_CONFIG_PATH=/usr/lib/arm-linux-gnueabihf/pkgconfig

        # Run your build script
        bin/release/release.sh
        
        # Update path for the packaging steps
        echo "${PWD}/target/armv7-unknown-linux-gnueabihf/release" >> "${GITHUB_PATH}"

    - name: Get version
      run: |
        VERSION=$(bin/release/get_version.sh)
        echo "VERSION=${VERSION}" | tee -a "${GITHUB_ENV}"

    - name: Create generic linux package
      run: |
        bin/release/man.sh
        bin/release/create_tarball.sh

    - name: Archive production artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
      with:
        name: release-generic-linux-armv7-artifacts
        path: target/upload/*